name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs on every pull request. --strict turns broken internal links and
  # missing nav entries into build failures, so a PR that breaks a link or
  # forgets to add a new page to its .pages file cannot be merged.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install dependencies
        run: pip install -r requirements-docs.txt

      - name: Build site
        run: mkdocs build --strict

      # --strict validates links written in Markdown, but not links produced by
      # the navigation itself. A .pages entry pointing outside its own directory
      # is passed through into the sidebar as a raw .md href that 404s, and the
      # build stays green. This catches that. The only legitimate .md links in
      # the output are the "Edit this page" links back to GitHub.
      - name: Check for unresolved .md links in the built site
        run: |
          if grep -rhoP 'href="[^"]*\.md"' site --include="*.html" \
               | grep -v 'github\.com' | sort -u | grep .; then
            echo "::error::Found .md links in the built site (listed above)."
            echo "These do not resolve. A nav entry in a .pages file most likely"
            echo "references a file outside its own directory, which MkDocs"
            echo "cannot resolve. Move the page, or cross-link it from the page"
            echo "body instead of the navigation."
            exit 1
          fi
          echo "No unresolved .md links."

      - name: Upload artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
