markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true

# Fail the build on a broken internal link rather than shipping one. The
# migrated pages contain two deliberate absolute links to unpublished
# WordPress stubs, which are external as far as MkDocs is concerned.
validation:
  links:
    absolute_links: ignore
    unrecognized_links: warn
  nav:
    omitted_files: warn
    not_found: warn

extra:
  social:
    - icon: material/web
      link: https://www.eea.europa.eu/
      name: European Environment Agency
