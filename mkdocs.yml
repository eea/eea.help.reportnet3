markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true

# Fail the build on a broken internal link rather than shipping one. The
# migrated pages contain two deliberate absolute links to unpublished
# WordPress stubs, which are external as far as MkDocs is concerned.
validation:
  links:
    absolute_links: ignore
    unrecognized_links: warn
  nav:
    omitted_files: warn
    not_found: warn

extra:
  # Removes the "Made with Material for MkDocs" line from the footer. The
  # override in overrides/partials/copyright.html honours this flag, so the
  # notice can be restored by deleting the line rather than editing markup.
  generator: false

  # Points the header logo and site title at the Reportnet platform itself
  # rather than at this site's own home page. Material reads this key directly;
  # no theme override is needed.
  homepage: https://reportnet.europa.eu/

extra_css:
  - assets/theme/extra.css
