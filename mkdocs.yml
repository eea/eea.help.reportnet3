site_name: Reportnet 3 documentation
site_description: User guide, service documentation and operational runbooks for the Reportnet 3 platform
# GitHub Pages serves this project site from a subpath, which has to be part of
# site_url or the generated redirect stubs and canonical links point at the
# domain root and 404. Change this if the site later moves to a custom domain
# such as help.reportnet.europa.eu.
site_url: https://eea.github.io/eea.help.reportnet3/
copyright: European Environment Agency

# repo_url / edit_uri drive the "Edit this page" link on every page.
repo_url: https://github.com/eea/eea.help.reportnet3
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  language: en
  features:
    - navigation.tabs          # top-level sections become tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  # awesome-pages reads the per-directory .pages files that hold the nav order.
  # Without it, MkDocs falls back to alphabetical, and the ordering carried over
  # from WordPress is lost.
  - awesome-pages
